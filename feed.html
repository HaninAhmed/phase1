<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>News Feed</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <section class="topBar">
            <div class="logowithtext">
                <a href="index.html">
                    <img src="/images/postify logo.png" 
                    alt="Postify Logo" 
                    class="logo">
                </a>
                <h1>Postify</h1>
            </div>

            <form id="searchForm" role="search" aria-label="Search on Postify" class="searchBar">
                <input id="searchInput" 
                name="search" 
                type="search" 
                placeholder="Search Postify..." 
                class="searchBar">
            </form>
        </section>
    </header>

<nav class="navbar">


<button onclick="logout()">Logout</button>

</nav>

<main>

    <div class="leftSideBar"></div>

    <div class="postSection">



    <div class="post">

    <h3>Create Post</h3>

    <textarea id="postContent" placeholder="What do you want to post?"></textarea>

    <br><br>

    <button onclick="createPost()">Post</button>

    </div>


    <h3>News Feed</h3>


    <div id="feed">

    <!-- Posts will appear here using JavaScript -->

    </div>
    <div class="rightSideBar"></div>

    </div>
</main>


<script src="feed.js"></script>

    <footer>
        <p>&copy; 2026 Postify</p>
    </footer>

</body>

</html>
