<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Postify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <section class="topBar">
      <div class="logowithtext">
        <a href="index.html">
          <img src="/images/postify logo.png" alt="Postify Logo" class="logo">
        </a>
        <h1>Postify</h1>
      </div>
    </section>
  </header>

  <main>
    <aside class="leftSideBar">
      <section class="userSideInfo">
        <img src="/images/profilePhoto.png"
          alt="userPhoto"
          class="userPhoto"
          id="userPhoto">
        <div class="userInfo">
          <p id="userName" class="userName">UserName</p>
        </div>
      </section>

        <nav class="navBar">
            <a href="feed.html" class="pageLink">Posts</a>
            <a href="profile.html" class="pageLink">Profile</a>
            <a href="loginpage.html" class="pageLink" onclick="logout(); return false;">Log out</a>
        </nav>

      <button type="button" class="mainBtn" onclick="window.location.href='feed.html'">+ New Post</button>
    </aside>

    <section class="centerSide">
      <h2>Welcome to Postify!</h2>
    </section>
    
    <aside class="rightSideBar">
      <section class="discover">
        <h2>Discover</h2>
        <div id="followingList"></div>
      </section>
    </aside>
  </main>

  <footer>
    <p>&copy; 2026 Postify</p>
  </footer>

  <script src="index.js"></script>
</body>
</html>
