<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Postify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <section class="topBar">
            <div class="logowithtext">
                <a href="index.html">
                    <img src="/images/postify logo.png" 
                    alt="Postify Logo" 
                    class="logo">
                </a>
                <h1>Postify</h1>
            </div>

            <form id="searchBar" role="search" aria-label="Search on Postify" class="searchBar">
                <input id="searchBar" name="search" type="search" placeholder="Search Postify..." class="searchBar">
            </form>
        </section>
    </header>
    
    <main>
              <aside class="leftSideBar">
            <section class="userSideInfo">
                <img src="/images/profilePhoto.png"
                alt="userPhoto"
                class="userPhoto"
                id="userPhoto">
                <div class="userInfo">
                    <p id="userName"
                    class="userName"
                    >UserName</p>
                </div>
            </section>

            <nav class="navBar">
                <a href="profile.html" class="pageLink">Profile</a>
                <a href="loginpage.html" class="pageLink">Log out</a>
                
            </nav>

            <button type="button" class="mainBtn">+ New Post</button>
        </aside>
    </main>
    <footer>
      <p>&copy; 2026 Postify</p>
    </footer>
</body>
</html>
