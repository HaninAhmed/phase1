<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page </title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
        <section class="topBar">
            <div class="logowithtext">
                <a href="-">
                    <img src="/images/postify logo.png" 
                    alt="Postify Logo" 
                    class="logo">
                </a>
                <h1>Postify</h1>
            </div>
        </section>
    </header>

    <main>
        <aside class="sideBar">
            <section class="userSideInfo">
                <img src=""
                alt="userPhoto"
                class="userPhoto"
                id="userPhoto">
                <div class="userInfo">
                    <p id="userName"
                    class="userName"
                    >UserName</p>
                </div>
            </section>

            <nav class="navBar">
                <a href="-" class="pageLink">Home</a>
                <a href="loginpage.html" class="pageLink">Login out</a>
                
            </nav>

            <button type="button" class="mainBtn">+ New Post</button>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 Postify</p>
    </footer>
</body>
</html>
