<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page </title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <section class="topBar">
            <div class="logowithtext">
                <a href="index.html">
                    <img src="/images/postify logo.png" 
                    alt="Postify Logo" 
                    class="logo">
                </a>
                <h1>Postify</h1>
            </div>

            <form id="searchBar" role="search" aria-label="Search on Postify" class="searchBar">
                <input id="searchBar" name="search" type="search" placeholder="Search Postify..." class="searchBar">
            </form>
        </section>
    </header>

    <main>
        <!-- Left -->
        <aside class="leftSideBar">
            <section class="userSideInfo">
                <img src=""
                alt="userPhoto"
                class="userPhoto"
                id="userPhoto">
                <div class="userInfo">
                    <p id="userName"
                    class="userName"
                    >UserName</p>
                </div>
            </section>

            <nav class="navBar">
                <a href="index.html" class="pageLink">Home</a>
                <a href="loginpage.html" class="pageLink">Login out</a>
                
            </nav>

            <button type="button" class="mainBtn">+ New Post</button>
        </aside>

        <!-- Center -->
        <section class="centerSide" aria-label="Profile content">
            <div class="profileDiv">
                <div class="userInfo">
                    <h2>@username</h2>
                    <p id="userBio" class="userBio">Edit your bio (optional)</p>
                </div>
                <div class="userStats">
                    <div class="counterBox">
                        <span class="countNumber" id="postCount">0</span>
                        <span class="countLabel">Posts</span>
                    </div>
                    <div class="counterBox">
                        <span class="countNumber" id="followerCount">0</span>
                        <span class="countLabel">Followers</span>
                    </div>
                    <div class="counterBox">
                        <span class="countNumber" id="followingCount">0</span>
                        <span class="countLabel">Following</span>
                    </div>

                    <div class="actions">
                        <button type="button" id="followBtn" class="mainBtn">Follow</button>
                        <button type="button" id="unfollowBtn" class="secBtn">Unfollow</button>
                    </div>
                </div>
            </div>
            
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Postify</p>
    </footer>
</body>
</html>
